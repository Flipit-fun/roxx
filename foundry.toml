[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Named RPC endpoints. Replace {API_KEY} with your Alchemy key (or another
# Robinhood Chain provider endpoint). You can also pass --rpc-url directly.
[rpc_endpoints]
robinhood        = "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
robinhood_testnet = "https://robinhood-testnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[etherscan]
# Blockscout verification for Robinhood Chain. The API key value is unused by
# Blockscout but the field must be present.
robinhood = { key = "any", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
