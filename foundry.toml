[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Named RPC endpoints for Arc (Circle's USDC-native L1).
# Official list: https://docs.arc.io/arc/references/connect-to-arc
# You can also pass --rpc-url directly.
[rpc_endpoints]
arc         = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

# Source verification: use the Arc explorer (https://explorer.arc.io) once it
# exposes a verification API, or verify through its UI. See DEPLOY.md.
